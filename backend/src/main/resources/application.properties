# Server Port Configuration
server.port=8080

# Spring Application Name
spring.application.name=skyline-air-backend

# Database Configuration (H2 embedded in-memory database with MySQL compatibility mode)
# To use external MySQL server, switch to:
# spring.datasource.url=jdbc:mysql://localhost:3306/skyline_air_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:h2:file:./data/skyline_air_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization Settings (Directly and exclusively loads database/schema.sql and database/sample_data.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=optional:file:../database/schema.sql,optional:file:./database/schema.sql
spring.sql.init.data-locations=optional:file:../database/sample_data.sql,optional:file:./database/sample_data.sql
spring.sql.init.continue-on-error=true
