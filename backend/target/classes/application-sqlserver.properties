# ============================================================================
# Spring Boot Configuration Profile: Microsoft SQL Server (SSMS)
# ============================================================================

# Database Connection Settings for SQL Server on port 1433
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SkyLineAirDB;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=sky123

# JPA / Hibernate Configuration for Microsoft SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console & H2 initializers when using SQL Server
spring.h2.console.enabled=false
spring.sql.init.mode=never
